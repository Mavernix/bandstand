<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Bandstand's icon: a dark glossy disc with a silver eighth note. -->
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <!-- Raises the note: a soft shadow below and a light edge along its top. -->
    <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset in="SourceAlpha" dy="3" result="down"/>
      <feGaussianBlur in="down" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#000" flood-opacity="0.7"/>
      <feComposite in2="blur" operator="in" result="shadow"/>
      <feOffset in="SourceAlpha" dy="2" result="shifted"/>
      <feComposite in="SourceAlpha" in2="shifted" operator="out" result="rim"/>
      <feFlood flood-color="#fff" flood-opacity="0.55"/>
      <feComposite in2="rim" operator="in" result="highlight"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="highlight"/>
      </feMerge>
    </filter>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5e66"/>
      <stop offset="0.45" stop-color="#25272c"/>
      <stop offset="1" stop-color="#121316"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.32" r="0.72">
      <stop offset="0" stop-color="#3b3f47"/>
      <stop offset="0.55" stop-color="#1a1c21"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="note" gradientUnits="userSpaceOnUse" x1="0" y1="76" x2="0" y2="168">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#c9ccd2"/>
      <stop offset="1" stop-color="#8a8e96"/>
    </linearGradient>
  </defs>

  <!-- Dark rim -->
  <g filter="url(#drop)">
    <circle cx="128" cy="126" r="112" fill="url(#chrome)"/>
  </g>
  <circle cx="128" cy="126" r="111" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="128" cy="126" r="100" fill="#050506"/>

  <!-- Dark face -->
  <circle cx="128" cy="126" r="97" fill="url(#face)"/>
  <g fill="none" stroke="#fff" stroke-opacity="0.035" stroke-width="1">
    <circle cx="128" cy="126" r="86"/>
    <circle cx="128" cy="126" r="74"/>
    <circle cx="128" cy="126" r="62"/>
    <circle cx="128" cy="126" r="50"/>
  </g>

  <!-- The note, drawn as a single outline so nothing can show at the joins -->
  <path transform="translate(20 7)" fill="url(#note)" filter="url(#raise)"
        d="M 103 133.16 L 103 76 L 113 76 C 126 87, 149 94, 146 124 C 141 109, 127 105, 113 103 L 113 140.65 A 23 16.5 -22 1 1 103 133.16 Z"/>

  <!-- Glass gloss over the top half -->
  <ellipse cx="128" cy="80" rx="80" ry="50" fill="url(#gloss)"/>
</svg>
