# A pushed version tag (v0.1.0) becomes a GitHub release with what the
# Mavernix App Store installs: the bundle, the store listing and its pictures
# (packaging/make-bundle). The release notes are the tag's message, and the
# store shows them under "What's New".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Check out
        run: |
          dnf install -y git gh
          git clone --branch "$GITHUB_REF_NAME" --depth 1 \
              "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" source
          git -C source fetch --depth 1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - name: Build the bundle
        run: source/packaging/make-bundle out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd source
          notes=$(git tag --list --format='%(contents)' "$GITHUB_REF_NAME")
          gh release create "$GITHUB_REF_NAME" ../out/* --title "Bandstand ${GITHUB_REF_NAME#v}" --notes "$notes"
